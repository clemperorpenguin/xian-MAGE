[project]
name = "xian-bridge"
version = "1.0.0"
description = "Local bridge service exposing OCR, document processing, glossary, and shared cache to the MASHA extension"
requires-python = ">=3.10, <3.14"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "xian-vl[ocr]",
    "luduan-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian_bridge"]

[tool.uv.sources]
xian-vl = { workspace = true }
luduan-client = { workspace = true }
